[package]
name = "fcitx5-candidate-translator"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
cxx = "1.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.8"

[build-dependencies]
cxx-build = "1.0"
pkg-config = "0.3.32"
